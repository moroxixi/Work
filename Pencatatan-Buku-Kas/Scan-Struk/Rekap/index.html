<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rekap Harga — Scan Struk Belanja</title>
<link rel="stylesheet" href="style.css" />
<link rel="prefetch" href="../../index.html" />
<link rel="prefetch" href="../index.html" />
<link rel="prefetch" href="../../Riwayat/index.html" />
<link rel="prefetch" href="../../Stok/index.html" />
<style>#page-loader{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--ink,#232b27),var(--masuk,#2f6e52));z-index:9999;pointer-events:none;width:0;opacity:0;transition:width .35s cubic-bezier(.4,0,.2,1),opacity .15s}#page-loader.active{opacity:1}@media(prefers-reduced-motion:reduce){#page-loader{transition:none}#page-loader.active{width:90%}}</style>
</head>
<body>
<div class="wrap">
<nav class="quicknav" aria-label="Navigasi cepat" data-page="rekap" data-depth="2"></nav>
  <header>
    <p class="eyebrow">Riwayat Harga · Scan Struk</p>
    <h1>Rekap Harga Barang</h1>
    <p class="sub">Cari &amp; pantau histori harga belanja per toko. Data baca-saja dari sheet "Input Harga Belanja" — urutan otomatis paling baru di atas.</p>
  </header>

  <section class="card" aria-label="Filter dan pencarian">
    <div class="filter-row">
      <div class="field">
        <label for="searchInput">Cari nama barang</label>
        <input type="search" id="searchInput" placeholder="mis. minyak, telor, cabai…" autocomplete="off" />
      </div>
      <div class="field">
        <label for="tokoSelect">Toko</label>
        <select id="tokoSelect">
          <option value="__semua__">Semua Toko</option>
        </select>
      </div>
    </div>
    <div class="filter-actions">
      <button type="button" id="refreshBtn" class="btn btn-ghost">
        <span class="btn-icon" aria-hidden="true">&#8635;</span> Muat Ulang
      </button>
      <span class="summary" id="summaryLabel" role="status"></span>
    </div>
  </section>

  <main id="listWrap" class="list-wrap" aria-live="polite">
    <p class="msg" id="loadingMsg">Memuat data…</p>
    <p class="msg empty" id="emptyMsg" hidden>Belum ada data. Coba scan &amp; simpan struk dulu.</p>
    <p class="msg err" id="errorMsg" hidden></p>
    <div id="itemList"></div>
  </main>
</div>
<div id="page-loader" role="progressbar" aria-hidden="true"></div>
<script src="../../nav.js"></script>
<script src="https://moroxixi.github.io/Work/Pencatatan-Buku-Kas/config.js"></script>
<script src="https://moroxixi.github.io/Work/Pencatatan-Buku-Kas/shared-utils.js"></script>
<script src="script.js"></script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href]');if(!a||a.hostname!==location.hostname||!a.href.includes('Pencatatan-Buku-Kas'))return;var l=document.getElementById('page-loader');if(l){l.classList.add('active');l.style.width='75%';setTimeout(function(){l.style.width='90%'},200)}})</script>
</body>
</html>
