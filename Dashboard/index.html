<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="tb-title">dashboard</span>
    <span class="tb-clock" id="clk">00:00:00</span>
    <button class="tb-menu-btn" id="menuBtn" aria-label="Bookmarks">
      <i class="ti ti-menu-2"></i>
    </button>
  </div>

  <div class="body">
    <!-- Desktop sidebar -->
    <div class="sidebar">
      <div id="bm-desktop">
        <div class="bm-item"><div class="bm-dot"></div><span>loading<span class="ld">█</span></span></div>
      </div>
    </div>

    <!-- Mobile drawer -->
    <div class="drawer-overlay" id="overlay"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <span class="drawer-title">menu</span>
        <button class="drawer-close" id="drawerClose"><i class="ti ti-x"></i></button>
      </div>
      <div id="bm-mobile">
        <div class="bm-item"><div class="bm-dot"></div><span>loading<span class="ld">█</span></span></div>
      </div>
    </div>

    <div class="main">
      <div class="toprow">
        <input class="search-box" id="srch" placeholder="search apps...">
        <span class="cnt" id="cnt">0 apps</span>
      </div>
      <div class="proj-wrap" id="projWrap">
        <div class="empty">fetching nodes<span class="ld">█</span></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
