<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MAO — Leaderboard</title>
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #2a2a2a;
      --text:      #f0f0f0;
      --text-dim:  #888;
      --accent1:   #ff4d1c;
      --accent2:   #ffb300;
      --gradient:  linear-gradient(135deg, #ff4d1c, #ffb300);
      --gradient-h: linear-gradient(90deg, #ff4d1c, #ffb300);
      --danger:    #ff4444;
      --radius:    12px;
      --gold:      #ffd700;
      --silver:    #c0c0c0;
      --bronze:    #cd7f32;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      line-height: 1.5;
    }
    .page { width: 100%; max-width: 480px; padding-bottom: 130px; }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(255, 77, 28, 0.08);
    }
    .card-title {
      text-align: center; font-size: 1.3rem; font-weight: 800;
      margin-bottom: 20px; background: var(--gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-logo { display: block; height: auto; max-width: min(70%, 200px); margin: 0 auto 14px; border-radius: 18px; }
    .tagline { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; letter-spacing: 0.04em; }

    /* Search */
    .search-box {
      width: 100%; padding: 12px 14px; font-size: 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); outline: none;
      margin-bottom: 16px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(255, 77, 28, 0.15); }
    .search-box::placeholder { color: #555; }

    /* States */
    .state-msg { text-align: center; padding: 40px 20px; color: var(--text-dim); }
    .state-msg p { margin-top: 12px; font-size: 0.9rem; }
    .state-msg a {
      display: inline-block; margin-top: 20px; padding: 12px 24px;
      background: var(--gradient-h); color: #fff; text-decoration: none;
      border-radius: 8px; font-weight: 700;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--accent1); border-radius: 50%;
      margin: 0 auto 12px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Leaderboard list */
    .lb-list { display: flex; flex-direction: column; gap: 6px; }
    .lb-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; min-height: 48px;
    }
    .lb-rank {
      width: 32px; font-size: 0.85rem; font-weight: 800;
      text-align: center; flex-shrink: 0; color: var(--text-dim);
    }
    .lb-item:nth-child(1) .lb-rank { color: var(--gold); font-size: 1rem; }
    .lb-item:nth-child(2) .lb-rank { color: var(--silver); }
    .lb-item:nth-child(3) .lb-rank { color: var(--bronze); }
    .lb-info { flex: 1; min-width: 0; }
    .lb-username {
      font-size: 0.9rem; font-weight: 700; color: var(--text);
      overflow-wrap: anywhere;
    }
    .lb-kode {
      font-size: 0.75rem; color: var(--text-dim); margin-top: 1px;
    }
    .lb-poin {
      font-size: 0.95rem; font-weight: 800; color: var(--accent2);
      flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .lb-no-results { text-align: center; padding: 20px; color: var(--text-dim); font-size: 0.9rem; }

    /* Quicknav */
    .quicknav {
      position: fixed; bottom: 52px; left: 0; right: 0;
      display: flex; gap: 4px; padding: 6px 8px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--border); z-index: 99;
    }
    .quicknav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 6px 2px 5px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 10px;
      text-decoration: none; color: var(--text-dim);
      transition: background 0.12s, border-color 0.12s, transform 0.15s;
      min-width: 0;
    }
    .quicknav-item:active { transform: scale(0.95); }
    .quicknav-item.is-active { border-color: var(--accent1); color: var(--text); background: rgba(255, 77, 28, 0.1); }
    .quicknav-icon { display: flex; width: 18px; height: 18px; flex-shrink: 0; }
    .quicknav-icon svg { width: 100%; height: 100%; }
    .quicknav-label {
      font-size: 9px; font-weight: 600; letter-spacing: 0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; text-align: center;
    }

    /* Floater */
    .floater-help {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--border); font-size: 0.8rem;
      color: var(--text-dim); z-index: 100;
    }
    .floater-help a { color: var(--accent2); font-weight: 700; text-decoration: none; white-space: nowrap; }
    .floater-help a:hover { text-decoration: underline; }

    /* Hard refresh button */
    .hard-refresh-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
      z-index: 10;
    }
    .hard-refresh-btn:hover { color: var(--accent1); border-color: var(--accent1); }
    .hard-refresh-btn:active { transform: scale(0.9); }
    .hard-refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .form-card { position: relative; }
  </style>
</head>
<body>
  <div class="page">
    <div class="form-card">
      <div class="brand">
        <img src="../assets/logo-mao.jpeg" alt="MAO" class="brand-logo">
        <p class="tagline">Leaderboard</p>
      </div>

      <!-- Search -->
      <input type="text" id="searchInput" class="search-box" placeholder="Cari username atau kode member…" hidden>

      <!-- Loading state -->
      <div id="loadingState" class="state-msg">
        <div class="spinner"></div>
        <p>Memuat leaderboard…</p>
      </div>

      <!-- Leaderboard list -->
      <div id="lbList" class="lb-list" hidden></div>

      <!-- No results (search) -->
      <div id="noResults" class="state-msg" hidden>
        <p style="font-size:2rem;">🔍</p>
        <p>Tidak ditemukan hasil yang cocok.</p>
      </div>

      <!-- Empty state (no data) -->
      <div id="emptyState" class="state-msg" hidden>
        <p style="font-size:2rem;">🏆</p>
        <p>Belum ada data poin saat ini.</p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="state-msg" hidden>
        <p style="font-size:2rem;">⚠️</p>
        <p id="errorMsg"></p>
        <a href="javascript:location.reload()">Coba Lagi</a>
      </div>
    </div>

    <!-- Quicknav -->
    <nav class="quicknav" aria-label="Navigasi cepat" data-page="leaderboard"></nav>
  </div>

  <!-- Floater -->
  <div class="floater-help">
    <span>Bingung atau ada data yang mau diedit?</span>
    <a href="https://wa.me/6283156569954?text=Halo%20Admin,%20saya%20mau%20tanya%20soal%20halaman%20Leaderboard.%20" target="_blank" rel="noopener">Hubungi Admin 📱</a>
  </div>

  <script src="../config.js"></script>
  <script src="../data-cache.js"></script>
  <script src="../nav.js"></script>
  <script>
  (function () {
    'use strict';

    var searchInput = document.getElementById('searchInput');
    var loadingState = document.getElementById('loadingState');
    var lbList = document.getElementById('lbList');
    var noResults = document.getElementById('noResults');
    var emptyState = document.getElementById('emptyState');
    var errorState = document.getElementById('errorState');
    var errorMsg = document.getElementById('errorMsg');

    var allData = []; // full leaderboard data

    function showState(state) {
      loadingState.hidden = state !== 'loading';
      lbList.hidden = state !== 'list';
      noResults.hidden = state !== 'noresults';
      emptyState.hidden = state !== 'empty';
      errorState.hidden = state !== 'error';
      searchInput.hidden = state !== 'list';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    /**
     * Formatter skor — SATU titik format poin untuk seluruh halaman.
     * Data mentah dari backend (item.poin, number) diformat di sini, bukan
     * saat render, supaya semua render (list penuh & hasil filter) konsisten.
     */
    function formatPoin(n) {
      return (Number(n) || 0).toLocaleString('id-ID') + ' poin';
    }

    function renderList(data) {
      lbList.innerHTML = '';
      data.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'lb-item';
        div.innerHTML =
          '<span class="lb-rank">' + (item.rank || '-') + '</span>' +
          '<div class="lb-info">' +
            '<div class="lb-username">@' + escapeHtml(item.username || '-') + '</div>' +
            '<div class="lb-kode">' + escapeHtml(item.kode) + '</div>' +
          '</div>' +
          '<span class="lb-poin">' + formatPoin(item.poin) + '</span>';
        lbList.appendChild(div);
      });
    }

    function filterList(query) {
      var q = query.trim().toLowerCase();
      if (!q) {
        renderList(allData);
        noResults.hidden = true;
        lbList.hidden = false;
        return;
      }
      var filtered = allData.filter(function (item) {
        return item.username.toLowerCase().indexOf(q) !== -1 ||
               item.kode.toLowerCase().indexOf(q) !== -1;
      });
      if (filtered.length === 0) {
        lbList.hidden = true;
        noResults.hidden = false;
      } else {
        renderList(filtered);
        lbList.hidden = false;
        noResults.hidden = true;
      }
    }

    searchInput.addEventListener('input', function () {
      filterList(searchInput.value);
    });

    // ─── CACHE + STALE-WHILE-REVALIDATE ──────────────────────────────────
    var CACHE_KEY = 'leaderboard_data';
    var refreshBtn = null;

    function processData(data) {
      allData = data;
      if (allData.length === 0) {
        showState('empty');
        return;
      }
      // Assign rank (1-based) SEBELUM filtering
      allData.forEach(function (item, idx) {
        item.rank = idx + 1;
      });
      renderList(allData);
      showState('list');
    }

    async function loadLeaderboard(forceFresh) {
      // Render dari cache dulu (instan, tanpa spinner)
      if (!forceFresh) {
        var cached = MAO_CACHE.get(CACHE_KEY);
        if (cached && cached.length > 0) {
          processData(cached);
        }
      }

      if (forceFresh) showState('loading');

      try {
        var resp = await fetch(MAO_CONFIG.GAS_WEB_APP_URL + '?action=getLeaderboard');
        var json = await resp.json();
        if (!json.success) throw new Error(json.error || 'Gagal memuat data');

        var freshData = json.leaderboard || [];
        MAO_CACHE.set(CACHE_KEY, freshData);

        // Kalau tidak ada cache sebelumnya, proses data fresh
        if (forceFresh || !(MAO_CACHE.get(CACHE_KEY) && allData.length > 0)) {
          processData(freshData);
        } else {
          // Stale-while-revalidate: update diam-diam tanpa flicker
          processData(freshData);
        }
      } catch (err) {
        console.error('Load leaderboard error:', err);
        if (allData.length === 0) {
          errorMsg.textContent = 'Gagal memuat data: ' + err.message;
          showState('error');
        }
      }
    }

    loadLeaderboard();

    // ─── HARD REFRESH (TUGAS 10) ──────────────────────────────────────────
    refreshBtn = document.createElement('button');
    refreshBtn.type = 'button';
    refreshBtn.className = 'hard-refresh-btn';
    refreshBtn.textContent = '↻';
    refreshBtn.title = 'Refresh data';
    refreshBtn.addEventListener('click', async function () {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '⏳';
      MAO_CACHE.clear(CACHE_KEY);
      await loadLeaderboard(true);
      refreshBtn.disabled = false;
      refreshBtn.textContent = '↻';
    });
    document.querySelector('.form-card').prepend(refreshBtn);
  })();
  </script>
</body>
</html>
