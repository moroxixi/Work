<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>MAO Admin — Cek Pesanan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- Header halaman (pola MoroDuit/Admin/Riwayat: header block + subtitle) -->
    <header class="page-header">
      <img src="../../assets/logo-mao.jpeg" alt="MAO" class="header-logo">
      <div class="header-text">
        <h1 class="header-title">🧾 Verifikasi Pesanan</h1>
        <p class="header-sub">Cek, edit, atau hapus pesanan yang masuk dari member</p>
      </div>
    </header>

    <!-- Loading state -->
    <div id="loadingState" class="state-card">
      <div class="spinner"></div>
      <p>Memuat daftar pesanan…</p>
    </div>

    <!-- Error state -->
    <div id="errorState" class="state-card" hidden>
      <p class="state-icon">⚠️</p>
      <p id="errorMsg"></p>
      <button type="button" id="retryBtn" class="btn-submit btn-retry">Coba Lagi</button>
    </div>

    <!-- Ringkasan + daftar pesanan -->
    <section id="listSection" hidden>

      <!-- Summary strip (pola .profit-summary di Riwayat) -->
      <div class="summary-strip">
        <div class="summary-block">
          <span class="summary-label">Total pesanan</span>
          <span id="summaryValue" class="summary-value">0</span>
        </div>
        <div class="summary-sep" aria-hidden="true"></div>
        <div class="summary-block">
          <span class="summary-label">Baris item</span>
          <span id="summaryItems" class="summary-value">0</span>
        </div>
      </div>

      <p class="list-info" id="pesananCount"></p>

      <!-- Empty state (pola .empty-state di Riwayat) -->
      <div id="emptyState" class="empty-state" hidden>
        Belum ada pesanan tercatat
      </div>

      <div id="pesananList" class="pesanan-list"></div>
    </section>

  </div>

  <!-- Lightbox: perbesar foto bukti -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-body">
      <img id="lightboxImg" class="lightbox-img" alt="Foto bukti pesanan">
      <button type="button" id="lightboxCloseBtn" class="lightbox-close">Tutup</button>
    </div>
  </div>

  <!-- Modal konfirmasi hapus (order-level) -->
  <div id="deleteModal" class="sheet-modal" hidden>
    <div class="sheet-modal-backdrop"></div>
    <div class="sheet-modal-sheet">
      <p class="sheet-modal-title">Hapus pesanan ini?</p>
      <p class="sheet-modal-text" id="deleteModalText"></p>
      <div id="deleteModalMsg" class="sheet-modal-msg" hidden></div>
      <button type="button" id="deleteConfirmBtn" class="btn-submit btn-danger">Ya, Hapus</button>
      <button type="button" id="deleteCancelBtn" class="sheet-modal-cancel">Batal</button>
    </div>
  </div>

  <!-- Modal edit order -->
  <div id="editModal" class="sheet-modal" hidden>
    <div class="sheet-modal-backdrop"></div>
    <div class="sheet-modal-sheet">
      <p class="sheet-modal-title">Edit Pesanan</p>
      <div id="editModalItems" class="edit-items"></div>
      <button type="button" id="editAddItemBtn" class="btn-add-item">+ Tambah Item</button>
      <div id="editModalMsg" class="sheet-modal-msg" hidden></div>
      <button type="button" id="editConfirmBtn" class="btn-submit">Simpan Perubahan</button>
      <button type="button" id="editCancelBtn" class="sheet-modal-cancel">Batal</button>
    </div>
  </div>

  <!-- Catatan: gate PIN embedded SUDAH DIHAPUS (2026-09-20). Login terpusat
       di ../index.html; halaman ini dijaga oleh ../admin-auth.js lewat
       MAO_ADMIN.onReady() → redirect ke login kalau belum authed. -->

  <!-- Admin nav -->
  <nav class="admin-nav" aria-label="Navigasi admin"></nav>

  <!-- Floater -->
  <div class="floater-help">
    <span>Ada kendala verifikasi?</span>
    <a href="https://wa.me/6283156569954?text=Halo%20Admin,%20saya%20mau%20tanya%20soal%20verifikasi%20pesanan.%20" target="_blank" rel="noopener">Hubungi Admin 📱</a>
  </div>

  <script src="../../config.js"></script>
  <script src="../admin-auth.js"></script>
  <script src="../admin-nav.js"></script>
  <script src="script.js"></script>
</body>
</html>
