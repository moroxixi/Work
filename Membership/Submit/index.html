<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MAO — Submit Pesanan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="section">
    <div class="form-card">

      <!-- Branding -->
      <div class="brand">
        <img src="../assets/logo-mao.jpeg" alt="MAO" class="brand-logo">
        <p class="tagline">Submit Pesanan</p>
      </div>

      <!-- Loading state awal -->
      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Memuat data…</p>
      </div>

      <!-- Form content (sembunyi dulu sampai data loaded) -->
      <form id="orderForm" novalidate hidden>

        <!-- Kode Membership -->
        <div class="form-group">
          <label for="kodeMembership">Kode Membership <span class="req">*</span></label>
          <select id="kodeMembership" name="kodeMembership" required>
            <option value="" disabled selected>Pilih Kode Membership</option>
          </select>
          
          <a href="../Pendaftaran/index.html" class="link-daftar">Belum punya kode? Daftar di sini →</a>
        </div>

        <!-- Menu List -->
        <div class="form-group">
          <label>Pesan Menu <span class="req">*</span></label>
          <div id="menuList" class="menu-list"></div>
          <span id="menuEmptyMsg" class="hint" hidden>Menu belum tersedia, hubungi admin</span>
        </div>

        <!-- Upload Foto -->
        <div class="form-group">
          <label for="fotoInput">Foto Pesanan <span class="req">*</span></label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="fotoInput" name="fotoInput" accept="image/*" capture="environment" hidden>
            <div id="uploadPlaceholder" class="upload-placeholder">
              <span class="upload-icon">📷</span>
              <span class="upload-text">Tap untuk pilih / ambil foto</span>
            </div>
            <img id="fotoPreview" class="foto-preview" hidden alt="Preview foto">
          </div>
          <span class="hint">Format: JPG/PNG, max 10MB sebelum kompresi</span>
        </div>

        <!-- Submit -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="btn-text">Kirim Pesanan</span>
          <span class="btn-loading" hidden>⏳ Mengirim…</span>
        </button>

        <!-- Error -->
        <div id="errorMsg" class="error-msg" hidden></div>

        <!-- Success -->
        <div id="successMsg" class="success-msg" hidden></div>
      </form>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="script.js"></script>
</body>
</html>
