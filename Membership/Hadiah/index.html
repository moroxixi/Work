<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MAO — Hadiah</title>
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #2a2a2a;
      --text:      #f0f0f0;
      --text-dim:  #888;
      --accent1:   #ff4d1c;
      --accent2:   #ffb300;
      --gradient:  linear-gradient(135deg, #ff4d1c, #ffb300);
      --gradient-h: linear-gradient(90deg, #ff4d1c, #ffb300);
      --danger:    #ff4444;
      --radius:    12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      line-height: 1.5;
    }
    .page { width: 100%; max-width: 480px; padding-bottom: 130px; }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(255, 77, 28, 0.08);
    }
    .card-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 20px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-logo { display: block; height: auto; max-width: min(70%, 200px); margin: 0 auto 14px; border-radius: 18px; }
    .tagline { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; letter-spacing: 0.04em; }

    /* Loading / Empty / Error states */
    .state-msg { text-align: center; padding: 40px 20px; color: var(--text-dim); }
    .state-msg p { margin-top: 12px; font-size: 0.9rem; }
    .state-msg a {
      display: inline-block; margin-top: 20px; padding: 12px 24px;
      background: var(--gradient-h); color: #120c00; text-decoration: none;
      border-radius: 8px; font-weight: 700;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--accent1); border-radius: 50%;
      margin: 0 auto 12px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hadiah list */
    .hadiah-list { display: flex; flex-direction: column; gap: 14px; }
    .hadiah-item {
      display: flex; gap: 14px; align-items: center;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; overflow: hidden;
    }
    .hadiah-foto {
      width: 80px; height: 80px; object-fit: cover; border-radius: 8px;
      background: var(--border); flex-shrink: 0;
    }
    .hadiah-foto.broken { display: none; }
    .hadiah-foto-placeholder {
      width: 80px; height: 80px; border-radius: 8px;
      background: var(--surface); border: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .hadiah-info { flex: 1; min-width: 0; }
    .hadiah-judul {
      font-size: 0.95rem; font-weight: 700; color: var(--text);
      margin-bottom: 4px; overflow-wrap: anywhere;
    }
    .hadiah-poin {
      font-size: 0.85rem; font-weight: 600; color: var(--accent2);
    }

    /* Quicknav */
    .quicknav {
      position: fixed; bottom: 52px; left: 0; right: 0;
      display: flex; gap: 4px; padding: 6px 8px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--border); z-index: 99;
    }
    .quicknav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 6px 2px 5px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 10px;
      text-decoration: none; color: var(--text-dim);
      transition: background 0.12s, border-color 0.12s, transform 0.15s;
      min-width: 0;
    }
    .quicknav-item:active { transform: scale(0.95); }
    .quicknav-item.is-active { border-color: var(--accent1); color: var(--text); background: rgba(255, 77, 28, 0.1); }
    .quicknav-icon { display: flex; width: 18px; height: 18px; flex-shrink: 0; }
    .quicknav-icon svg { width: 100%; height: 100%; }
    .quicknav-label {
      font-size: 9px; font-weight: 600; letter-spacing: 0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; text-align: center;
    }

    /* Request Hadiah: tombol + modal bottom-sheet (pola sama dgn photo-picker
       modal di Pendaftaran/Submit: fixed backdrop + sheet, [hidden] di-prioritaskan) */
    /* .btn-submit / .form-group / label: dibawa dari style.css halaman lain
       (halaman ini standalone dgn CSS inline, tidak load style.css) */
    .btn-submit {
      width: 100%; min-height: 48px; padding: 14px;
      font-size: 1rem; font-weight: 700;
      /* Kontras (QA mobile): teks putih di atas gradien brand cuma 1.79:1–3.32:1
         (gagal WCAG AA 4.5:1 untuk teks 16px). Tinta gelap = 5.87:1–10.7:1 dan
         tetap ≥4.5:1 saat hover (opacity .9). Gradien brand tidak diubah. */
      color: #120c00;
      background: var(--gradient-h); border: none; border-radius: 8px;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 600;
      margin-bottom: 6px; color: var(--text);
    }
    .req { color: var(--accent1); }
    .hadiah-request-btn { margin-top: 16px; }
    .req-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    }
    .req-modal[hidden] { display: none !important; }
    .req-modal-backdrop {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
    }
    .req-modal-sheet {
      position: relative; width: 100%; max-width: 480px;
      background: var(--surface); border-radius: 16px 16px 0 0;
      padding: 20px 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
      animation: slideUpReq 0.2s ease-out;
      /* QA mobile: tinggi sheet bisa melebihi layar (HP landscape atau saat
         keyboard virtual terbuka). Batasi tinggi + scroll internal supaya
         judul, field, dan tombol Kirim/Batal tetap terjangkau.
         dvh = tinggi viewport dinamis (fallback ke vh di browser lama). */
      max-height: calc(100vh - 8px);
      max-height: calc(100dvh - 8px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes slideUpReq { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .req-modal-title {
      text-align: center; font-size: 0.9rem; font-weight: 700;
      color: var(--text); margin-bottom: 16px;
    }
    .req-input, .req-textarea {
      width: 100%; padding: 12px 14px; font-size: 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit; line-height: 1.5;
      -webkit-appearance: none;
    }
    .req-input:focus, .req-textarea:focus {
      border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(255, 77, 28, 0.15);
    }
    .req-textarea { resize: vertical; min-height: 84px; }
    .req-msg {
      margin-top: 14px; padding: 12px 14px; border-radius: 8px;
      background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.3);
      color: var(--accent2); font-size: 0.85rem; text-align: center;
    }
    .req-cancel {
      display: block; width: 100%; padding: 12px; margin-top: 4px;
      background: none; border: none; color: var(--text-dim);
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    /* Floater */
    .floater-help {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--border); font-size: 0.8rem;
      color: var(--text-dim); z-index: 100;
    }
    .floater-help a {
      color: var(--accent2); font-weight: 700; text-decoration: none; white-space: nowrap;
      /* Area tap 19px → 45px (≥44px) tanpa menambah tinggi bar. */
      padding: 13px 6px; margin: -13px 0; flex-shrink: 0;
    }
    .floater-help a:hover { text-decoration: underline; }

    /* Bar floater WAJIB satu baris: di ≤360px teksnya dulu wrap jadi 2 baris
       (bar 44px → 63px) sehingga menabrak .quicknav di bottom:52px (overlap
       11px @320px). nowrap + ellipsis membuat tinggi bar tetap 44px. */
    .floater-help span {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Hard refresh button */
    .hard-refresh-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      /* QA mobile: naik ke ambang target sentuh 44px. */
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
      z-index: 10;
    }
    .hard-refresh-btn:hover { color: var(--accent1); border-color: var(--accent1); }
    .hard-refresh-btn:active { transform: scale(0.9); }
    .hard-refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* ─── Disclaimer statis (selalu tampil, di luar form) ──────────────────── */
    .disclaimer {
      margin-top: 18px;
      padding: 0 6px;
      font-size: 0.72rem;
      line-height: 1.55;
      /* QA: #7a7a7a hanya 4.29:1 di atas --surface (#141414) — di bawah WCAG AA
         (4.5:1) untuk teks <24px. Pakai token dim standar app (5.2:1). */
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="form-card">
      <div class="brand">
        <img src="../assets/logo-mao.jpeg" alt="MAO" class="brand-logo">
        <p class="tagline">Hadiah Membership</p>
      </div>

      <!-- Loading state -->
      <div id="loadingState" class="state-msg">
        <div class="spinner"></div>
        <p>Memuat daftar hadiah…</p>
      </div>

      <!-- Hadiah list -->
      <div id="hadiahList" class="hadiah-list" hidden></div>

      <!-- Empty state -->
      <div id="emptyState" class="state-msg" hidden>
        <p style="font-size:2rem;">🎁</p>
        <p>Belum ada hadiah yang tersedia saat ini.</p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="state-msg" hidden>
        <p style="font-size:2rem;">⚠️</p>
        <p id="errorMsg"></p>
        <a href="javascript:location.reload()">Coba Lagi</a>
      </div>

      <!-- Request hadiah: buka form kecil (modal) untuk katalog custom -->
      <button type="button" id="requestHadiahBtn" class="btn-submit hadiah-request-btn">🎁 Request Hadiah</button>
      <p class="disclaimer">Jika ingin menukarkan poin-mu, <a href="https://wa.me/6283156569954?text=Halo%20Admin,%20saya%20mau%20tukar%20poin%20jadi%20Hadiah." target="_blank" style="color: #007bff; text-decoration: underline;">Hubungi Admin.</a></p>
    </div>

    <!-- Modal: Request Hadiah -->
    <div id="requestHadiahModal" class="req-modal" hidden>
      <div class="req-modal-backdrop"></div>
      <div class="req-modal-sheet">
        <p class="req-modal-title">Request Hadiah</p>
        <div class="form-group">
          <label for="reqKode">Kode Membership <span class="req">*</span></label>
          <input type="text" id="reqKode" class="req-input" placeholder="MAO-XXXXXX" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="reqText">Hadiah yang diinginkan <span class="req">*</span></label>
          <textarea id="reqText" class="req-textarea" rows="3" placeholder="Tulis nama hadiah yang kamu inginkan…"></textarea>
        </div>
        <div id="reqMsg" class="req-msg" hidden></div>
        <button type="button" id="reqSubmitBtn" class="btn-submit">Kirim Request</button>
        <button type="button" id="reqCancelBtn" class="req-cancel">Batal</button>
      </div>
      
    </div>

    <!-- Quicknav -->
    <nav class="quicknav" aria-label="Navigasi cepat" data-page="hadiah"></nav>
  </div>

  <!-- Floater -->
  <div class="floater-help">
    <span>Bingung atau mau tukar poin?</span>
    <a href="https://wa.me/6283156569954?text=Halo%20Admin,%20saya%20mau%20tanya%20soal%20halaman%20Hadiah.%20" target="_blank" rel="noopener">Hubungi Admin 📱</a>
  </div>

  <script src="../config.js"></script>
  <script src="../data-cache.js"></script>
  <script src="../nav.js"></script>
  <script>
  (function () {
    'use strict';

    var loadingState = document.getElementById('loadingState');
    var hadiahList = document.getElementById('hadiahList');
    var emptyState = document.getElementById('emptyState');
    var errorState = document.getElementById('errorState');
    var errorMsg = document.getElementById('errorMsg');

    function showState(state) {
      loadingState.hidden = state !== 'loading';
      hadiahList.hidden = state !== 'list';
      emptyState.hidden = state !== 'empty';
      errorState.hidden = state !== 'error';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    var CACHE_KEY = 'hadiah_data';

    function renderHadiah(hadiah) {
      hadiahList.innerHTML = '';
        hadiah.forEach(function (item) {
          var div = document.createElement('div');
          div.className = 'hadiah-item';

          // Foto hadiah — kolom "URL Foto" di sheet berisi LINK SHARE Google
          // Drive (varian ?usp=drivesdk / ?usp=sharing / ?usp=drive_link), yang
          // tidak bisa langsung dijadikan <img src>. MAO_CONFIG.driveImageUrl()
          // mengekstrak file ID lalu mengubahnya ke /thumbnail?id=<ID>&sz=...
          // (deteksi varian + fallback lh3 ada di ../config.js).
          var hasFoto = item.urlFoto && item.urlFoto.trim() !== '';
          if (hasFoto) {
            var img = document.createElement('img');
            img.className = 'hadiah-foto';
            img.alt = escapeHtml(item.judul);
            img.loading = 'lazy';

            // Fallback berlapis: thumbnail → lh3.googleusercontent → placeholder.
            // (Gambar Drive tetap bisa gagal kalau file tidak di-share
            // "Anyone with the link".)
            MAO_CONFIG.attachDriveImageFallback(img, item.urlFoto, function () {
              var parent = img.parentNode;
              if (!parent) return;
              var phBroken = document.createElement('div');
              phBroken.className = 'hadiah-foto-placeholder';
              phBroken.textContent = '🎁';
              parent.replaceChild(phBroken, img);
            });

            img.src = MAO_CONFIG.driveImageUrl(item.urlFoto, 'small');
            div.appendChild(img);
          } else {
            var ph = document.createElement('div');
            ph.className = 'hadiah-foto-placeholder';
            ph.textContent = '🎁';
            div.appendChild(ph);
          }

          var info = document.createElement('div');
          info.className = 'hadiah-info';
          info.innerHTML =
            '<div class="hadiah-judul">' + escapeHtml(item.judul) + '</div>' +
            '<div class="hadiah-poin">' + item.poinDibutuhkan.toLocaleString('id-ID') + ' poin</div>';
          div.appendChild(info);

          hadiahList.appendChild(div);
        });

      showState('list');
    }

    async function loadHadiah(forceFresh) {
      // Render dari cache dulu (instan)
      if (!forceFresh) {
        var cached = MAO_CACHE.get(CACHE_KEY);
        if (cached && cached.length > 0) {
          renderHadiah(cached);
          showState('list');
        }
      }

      if (forceFresh) showState('loading');

      try {
        var resp = await fetch(MAO_CONFIG.GAS_WEB_APP_URL + '?action=getHadiah');
        var json = await resp.json();
        if (!json.success) throw new Error(json.error || 'Gagal memuat data');

        var hadiah = json.hadiah || [];
        MAO_CACHE.set(CACHE_KEY, hadiah);

        if (hadiah.length === 0 && !forceFresh) {
          showState('empty');
        } else {
          renderHadiah(hadiah);
          showState('list');
        }
      } catch (err) {
        console.error('Load hadiah error:', err);
        if (!MAO_CACHE.get(CACHE_KEY)) {
          errorMsg.textContent = 'Gagal memuat data: ' + err.message;
          showState('error');
        }
      }
    }

    loadHadiah();

    // Hard refresh button
    var refreshBtn = document.createElement('button');
    refreshBtn.type = 'button';
    refreshBtn.className = 'hard-refresh-btn';
    refreshBtn.textContent = '↻';
    refreshBtn.title = 'Refresh data';
    refreshBtn.addEventListener('click', async function () {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '⏳';
      MAO_CACHE.clear(CACHE_KEY);
      await loadHadiah(true);
      refreshBtn.disabled = false;
      refreshBtn.textContent = '↻';
    });
    document.querySelector('.form-card').style.position = 'relative';
    document.querySelector('.form-card').prepend(refreshBtn);

    // ─── Request Hadiah: modal + submit ke backend ────────────────────────
    // POST action=requestHadiah → doPostRequestHadiah_() di code.gs.js.
    // Baris request ditulis ke tab "Hadiah" (kolom Kode Membership +
    // Request Cust; kolom katalog dikosongkan) — tidak mengubah katalog.
    var requestHadiahBtn  = document.getElementById('requestHadiahBtn');
    var requestHadiahModal = document.getElementById('requestHadiahModal');
    var reqKode           = document.getElementById('reqKode');
    var reqText           = document.getElementById('reqText');
    var reqSubmitBtn      = document.getElementById('reqSubmitBtn');
    var reqCancelBtn      = document.getElementById('reqCancelBtn');
    var reqMsg            = document.getElementById('reqMsg');

    function showReqMsg(msg) {
      reqMsg.textContent = msg;
      reqMsg.hidden = false;
    }

    function hideReqMsg() {
      reqMsg.hidden = true;
      reqMsg.textContent = '';
    }

    function openReqModal() {
      hideReqMsg();
      requestHadiahModal.hidden = false;
    }

    function closeReqModal() {
      requestHadiahModal.hidden = true;
    }

    requestHadiahBtn.addEventListener('click', openReqModal);
    reqCancelBtn.addEventListener('click', closeReqModal);
    requestHadiahModal.querySelector('.req-modal-backdrop').addEventListener('click', closeReqModal);

    reqSubmitBtn.addEventListener('click', async function () {
      var kode = reqKode.value.trim();
      var teks = reqText.value.trim();

      hideReqMsg();
      if (!kode) { showReqMsg('Kode membership wajib diisi.'); return; }
      if (!teks) { showReqMsg('Tulis hadiah yang diinginkan.'); return; }

      reqSubmitBtn.disabled = true;
      reqSubmitBtn.textContent = '⏳ Mengirim…';

      try {
        var params = new URLSearchParams({
          action: 'requestHadiah',
          kodeMembership: kode,
          requestText: teks
        });
        var resp = await fetch(MAO_CONFIG.GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString()
        });
        var json = await resp.json();
        if (json.success) {
          reqKode.value = '';
          reqText.value = '';
          showReqMsg('✅ Request terkirim! Admin akan meninjaunya.');
        } else {
          showReqMsg(json.error || 'Gagal mengirim request. Coba lagi.');
        }
      } catch (err) {
        console.error('Request hadiah error:', err);
        showReqMsg('Gagal mengirim request. Periksa koneksi internet atau coba lagi.');
      } finally {
        reqSubmitBtn.disabled = false;
        reqSubmitBtn.textContent = 'Kirim Request';
      }
    });
  })();
  </script>
</body>
</html>
